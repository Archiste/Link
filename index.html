<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Archiste — My personal links."
    >

    <link rel="icon" type="image/x-icon" href="icon.ico">
    <link rel="apple-touch-icon" href="archiste.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="styles.css">

    <meta
        http-equiv="Content-Security-Policy"
        content="
            default-src 'self';
            style-src 'self' https://fonts.googleapis.com;
            font-src 'self' https://fonts.gstatic.com;
            img-src 'self' data:;
            media-src 'self';
            script-src 'self';
            connect-src 'self';
            object-src 'none';
            base-uri 'self';
            form-action 'self';
            upgrade-insecure-requests;
        "
    >

    <script src="script.js" defer></script>

    <title>Archiste</title>
</head>

<body>

    <div id="welcome-screen">
        <div class="welcome-content">
            <h2>welcome</h2>
            <p>click to enter</p>
            <button id="enter-site" type="button">
                Enter
            </button>
        </div>
    </div>

    <audio id="background-music" loop preload="auto">
        <source
            src="Evening Luxury (Diluc&Fischl)_ Genshin Impact Outfit Teaser INSANE Piano Arrangement.mp3"
            type="audio/mpeg"
        >
    </audio>

    <div class="background">
        <video
            class="background-video"
            autoplay
            muted
            loop
            playsinline
            preload="auto"
            aria-hidden="true"
        >
            <source
                src="92be9e2b-e503-4b50-b672-b32a10e6301f.mp4"
                type="video/mp4"
            >
        </video>
    </div>

    <main class="card">

        <div class="profile">
            <img
                src="archiste.png"
            >
        </div>

        <header>
            <h1>Archiste</h1>
            <p>My links.</p>
        </header>

        <nav aria-label="Main links">
            <ul>

                <li>
                    <a
                        class="link-button"
                        href="https://Archiste.github.io/Port"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        <span class="icon">↗</span>
                        <span>My website</span>
                        <span class="arrow">→</span>
                    </a>
                </li>

                <li>
                    <a
                        class="link-button"
                        href="https://open.spotify.com/user/crzwjqx022j2fh7534c25heom?si=94c13ba6b86e4e0f"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        <span class="icon">♫</span>
                        <span>My Spotify</span>
                        <span class="arrow">→</span>
                    </a>
                </li>

                <li>
                    <a
                        class="link-button"
                        href="#"
                        id="discord-link"
                    >
                        <span class="icon">◉</span>
                        <span>Contact me on Discord</span>
                        <span class="arrow">→</span>
                    </a>
                </li>

            </ul>
        </nav>

        <footer>
            <span>© 2026 Archiste</span>
        </footer>

    </main>

    <div class="music-player">
    <select id="music-select">
        <option value="music/Evening Luxury (Diluc&Fischl)_ Genshin Impact Outfit Teaser INSANE Piano Arrangement.mp3">pick a song ♫</option>

        <option value="music/Evening Luxury (Diluc&Fischl)_ Genshin Impact Outfit Teaser INSANE Piano Arrangement.mp3">
            Evening Luxury (Moi core mdr)
        </option>

        <option value="music/Quarto De Hotel - Hareton Salvanini but Its only the best part.mp3">
            Quatro de Hotel
        </option>

        <option value="music/Mac Miller - Congratulations (Piano Cover).mp3">
            Mac Miller - Congratulations
        </option>

        <option value="music/The Angel Pt.5 The Best Part.mp3">
            The Angel Pt.5 (eon)
        </option>

        <option value="music/zombie.mp3">
            zombie
        </option>

        <option value="music/city.mp3">
            city
        </option>

        <option value="music/MME. RIFFAUD.mp3">
           MME. RIFFAUD
        </option>

    </select>

    <button id="music-toggle" type="button">▶</button>
   </div>
   

    <div
        id="notification"
        role="status"
        aria-live="polite"
    >
        <span>✓</span>
        Discord copié !
    </div>

</body>
</html>
